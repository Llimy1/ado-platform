spring.application.name=api
server.port=${ADO_API_PORT:8080}

spring.datasource.url=${ADO_DATABASE_URL:}
spring.datasource.username=${ADO_DATABASE_USERNAME:}
spring.datasource.password=${ADO_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

ado.control-ui.origin=${ADO_CONTROL_UI_ORIGIN:http://localhost:3000}
