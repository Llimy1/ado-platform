services:
  postgres:
    image: postgres:18.4-alpine
    container_name: ado-platform-postgres
    environment:
      POSTGRES_DB: ${ADO_POSTGRES_DATABASE}
      POSTGRES_USER: ${ADO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${ADO_DATABASE_PASSWORD}
    ports:
      - "${ADO_POSTGRES_PORT}:5432"
    volumes:
      - ado-platform-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADO_DATABASE_USERNAME} -d ${ADO_POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ado-platform-postgres-data: