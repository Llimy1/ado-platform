services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ado_platform
      POSTGRES_USER: ado
      POSTGRES_PASSWORD: ado
    ports:
      - "${ADO_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ado -d ado_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ado_postgres_data:/var/lib/postgresql/data

volumes:
  ado_postgres_data:
